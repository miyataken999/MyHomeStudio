<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyHomeStudio - Fullscreen 100%</title>
  <style>
    /* 親要素の余白を全消去して100%画面を確保 */
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #0f172a; /* Tailwind slate-900 */
    }
    
    /* iframe を画面ぴったり100%に引き伸ばす */
    iframe {
      display: block;
      width: 100vw;
      height: 100vh;
      border: none;
      outline: none;
    }
  </style>
</head>
<body>

  <iframe 
    src="https://miyataken999.github.io/MyHomeStudio/" 
    allow="clipboard-read; clipboard-write; cross-origin-isolated; camera; microphone"
  ></iframe>

</body>
</html>
